services:
  # Production app
  tsundoku:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsundoku
    # Host ports are shifted off the Rust/Vite defaults (8080 / 5173) so this
    # stack can run side by side with Codex, which uses those defaults. Only
    # the host side moves; the container still listens on 8080 internally.
    # Override with TSUNDOKU_HTTP_PORT in .env if 8090 is also taken.
    ports:
      - "${TSUNDOKU_HTTP_PORT:-8090}:8080"
    volumes:
      - ./config:/app/config:ro
      # Named volume, not a host bind mount: SQLite's WAL relies on mmap'd
      # shared memory + byte-range locks, which are unreliable on bind
      # mounts backed by Docker Desktop's macOS FS (VirtioFS/gRPC-FUSE) and
      # cause "database disk image is malformed". A named volume lives on
      # the Linux VM's ext4, where WAL works. Inspect with
      # `docker compose exec tsundoku sqlite3 /app/data/db/tsundoku.db ...`;
      # back up with `docker run --rm -v tsundoku_data:/data ...`.
      - tsundoku_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: info
      # MangaBaka provider: offline dump + live API fallback. Set
      # TSUNDOKU_PROVIDERS__MANGABAKA__API_KEY in .env to enable the
      # fallback path; without a key cache misses surface as Ok(None).
      TSUNDOKU_PROVIDERS__MANGABAKA__OFFLINE_DUMP_URL: https://api.mangabaka.dev/v1/database/series.sqlite.tar.gz
      TSUNDOKU_PROVIDERS__MANGABAKA__OFFLINE_REFRESH_CRON: "0 4 * * 0"
      TSUNDOKU_PROVIDERS__MANGABAKA__API_FALLBACK: "true"
    restart: unless-stopped
    profiles:
      - prod
    networks:
      - tsundoku-net

  # Dev backend (cargo watch hot reload)
  tsundoku-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tsundoku-dev
    # Shifted off 8080 to coexist with Codex (see the prod service note).
    ports:
      - "${TSUNDOKU_HTTP_PORT:-8090}:8080"
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
      - ./config:/app/config:ro
      # Named volume rather than ./docker/data bind mount — see the prod
      # service for why (WAL + macOS bind mount corrupts the DB).
      - tsundoku_data_dev:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      RUST_BACKTRACE: "1"
      RUST_LOG: debug
      TSUNDOKU_PROVIDERS__MANGABAKA__OFFLINE_DUMP_URL: https://api.mangabaka.dev/v1/database/series.sqlite.tar.gz
      TSUNDOKU_PROVIDERS__MANGABAKA__OFFLINE_REFRESH_CRON: "0 4 * * 0"
      TSUNDOKU_PROVIDERS__MANGABAKA__API_FALLBACK: "true"
    profiles:
      - dev
    networks:
      - tsundoku-net

  # Dev frontend (Vite dev server with HMR; proxies to backend)
  frontend-dev:
    image: node:22-alpine
    container_name: tsundoku-frontend-dev
    working_dir: /app
    # Run Vite on the published port (not its 5173 default) so it doesn't
    # collide with Codex's dev server. Host and container port MUST match:
    # Vite's HMR websocket targets the *server* port, so a host≠container
    # remap would make HMR connect to the wrong port. Override both via
    # TSUNDOKU_WEB_PORT.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${TSUNDOKU_WEB_PORT:-5183}"
    ports:
      - "${TSUNDOKU_WEB_PORT:-5183}:${TSUNDOKU_WEB_PORT:-5183}"
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://tsundoku-dev:8080
    depends_on:
      - tsundoku-dev
    profiles:
      - dev
    networks:
      - tsundoku-net

  # ── Screenshot automation (Playwright) ────────────────────────────────────
  # Usage: make screenshots
  #        (or `docker compose --profile screenshots up -d --build`, then
  #         `docker compose --profile screenshots exec playwright npm run capture`)
  #
  # The backend uses the prebuilt image so cold-start is ~10s instead of
  # ~10min. Override with TSUNDOKU_IMAGE=tsundoku:latest in your shell
  # (or .env) to capture against a locally-built image.
  tsundoku-screenshots:
    image: ${TSUNDOKU_IMAGE:-ghcr.io/ashdevfr/tsundoku:latest}
    container_name: tsundoku-screenshots
    command:
      ["tsundoku", "serve", "--config", "/app/config/tsundoku.screenshots.toml"]
    volumes:
      - ./config:/app/config:ro
      # tmpfs-style: a named volume so SQLite WAL works inside the VM,
      # but a fresh one each `down -v` so screenshots are reproducible.
      - tsundoku_screenshots_data:/app/data
    environment:
      RUST_BACKTRACE: "1"
      RUST_LOG: debug
      # Wired so the per-host MangaBaka offline dump + live fallback
      # match the prod profile. Set TSUNDOKU_PROVIDERS__MANGABAKA__API_KEY
      # in your .env to unlock the live API fallback during screenshots.
      TSUNDOKU_PROVIDERS__MANGABAKA__OFFLINE_DUMP_URL: https://api.mangabaka.dev/v1/database/series.sqlite.tar.gz
      TSUNDOKU_PROVIDERS__MANGABAKA__API_FALLBACK: "true"
      # Admin token override hook — bumping it here automatically lines
      # up with ADMIN_TOKEN on the playwright service below, since both
      # read the same env var.
      TSUNDOKU_AUTH__ADMIN_TOKEN: ${SCREENSHOTS_ADMIN_TOKEN:-screenshots-admin-token}
    env_file:
      - path: .env
        required: false
    healthcheck:
      # 127.0.0.1, not localhost: the runtime image's /etc/hosts maps
      # localhost to both 127.0.0.1 and ::1, BusyBox wget tries IPv6
      # first, and tsundoku only binds IPv4 0.0.0.0 — so via localhost
      # the check fails with "Connection refused" forever.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # Shifted off 8082 too, in case Codex mirrors this stack's screenshot
    # profile. Internal traffic (healthcheck, playwright BASE_URL) stays 8080.
    ports:
      - "${TSUNDOKU_SCREENSHOTS_PORT:-8092}:8080"
    profiles:
      - screenshots
    networks:
      - tsundoku-net

  playwright:
    build:
      context: ./screenshots
      dockerfile: Dockerfile
    container_name: tsundoku-playwright
    working_dir: /work
    volumes:
      - ./screenshots:/work
      - ./screenshots/output:/work/output
      - playwright_node_modules:/work/node_modules
    environment:
      BASE_URL: http://tsundoku-screenshots:8080
      VIEWPORT_WIDTH: "1440"
      VIEWPORT_HEIGHT: "900"
      COLOR_SCHEME: dark
      # Same value as TSUNDOKU_AUTH__ADMIN_TOKEN above so the
      # localStorage seed and Authorization header match.
      ADMIN_TOKEN: ${SCREENSHOTS_ADMIN_TOKEN:-screenshots-admin-token}
      # Set POLL_ON_START=false to skip the Nyaa poll (empty-state run).
      POLL_ON_START: ${POLL_ON_START:-true}
      # Minimum soak time after triggering the poll, before scenarios
      # start. Gives MangaBaka enrichment + cover fetches time to land
      # so the browse/series-detail screenshots are richer than what
      # the resolver alone produces.
      POLL_WAIT_MIN_SECONDS: ${POLL_WAIT_MIN_SECONDS:-180}
      POLL_WAIT_MAX_SECONDS: ${POLL_WAIT_MAX_SECONDS:-300}
    depends_on:
      tsundoku-screenshots:
        condition: service_healthy
    profiles:
      - screenshots
    networks:
      - tsundoku-net

volumes:
  cargo_cache:
  target_cache:
  frontend_node_modules:
  # SQLite DB + provider caches + tmp scratch (the storage.data_dir root).
  # Named volumes so WAL mode is reliable; prod and dev are kept separate
  # so a dev wipe never touches prod data.
  tsundoku_data:
  tsundoku_data_dev:
  # Screenshot profile: ephemeral DB + cached npm install for Playwright.
  tsundoku_screenshots_data:
  playwright_node_modules:

networks:
  tsundoku-net:
    driver: bridge
