[package]
name = "td-download"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Torrent-client download clients for tsundoku's send-to-client action (v1: ruTorrent)"
repository.workspace = true

[dependencies]
td-http = { path = "../td-http" }
reqwest.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# ruTorrent behind a seedbox proxy commonly demands HTTP Digest auth, not
# Basic; reqwest only does Basic, so we compute the Digest response ourselves.
digest_auth = "0.3"
# rTorrent XML-RPC's load.raw_start carries the .torrent as base64.
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
