[package]
name = "tsundoku"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "tsundoku"
path = "src/main.rs"

[features]
default = []
# Embed the built `web/dist` into the binary at compile time.
# Requires `web/dist` to exist first (run `make frontend-build`).
embed-frontend = ["td-api/embed-frontend"]

[dependencies]
td-api = { path = "../td-api" }
td-config = { path = "../td-config" }
td-db = { path = "../td-db" }
td-http = { path = "../td-http" }
td-metadata = { path = "../td-metadata" }
td-metadata-mangabaka = { path = "../td-metadata-mangabaka" }
td-resolution = { path = "../td-resolution" }
td-scheduler = { path = "../td-scheduler" }
td-source = { path = "../td-source" }
td-source-nyaa = { path = "../td-source-nyaa" }

tokio.workspace = true
axum.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
clap.workspace = true
chrono.workspace = true
