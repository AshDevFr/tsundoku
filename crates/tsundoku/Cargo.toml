[package]
name = "tsundoku"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "tsundoku"
path = "src/main.rs"

[features]
default = []
# Embed the built `web/dist` into the binary at compile time.
# Requires `web/dist` to exist first (run `make frontend-build`).
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
td-config = { path = "../td-config" }
td-db = { path = "../td-db" }
td-metadata = { path = "../td-metadata" }
td-metadata-mangabaka = { path = "../td-metadata-mangabaka" }

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
clap.workspace = true
chrono.workspace = true

rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
