[package]
name = "td-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[features]
default = []
# Embed the built `web/dist` into the binary at compile time.
# Requires `web/dist` to exist first (run `make frontend-build`).
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
td-codex = { path = "../td-codex" }
td-config = { path = "../td-config" }
td-db = { path = "../td-db" }
td-download = { path = "../td-download" }
td-metadata = { path = "../td-metadata" }
td-resolution = { path = "../td-resolution" }
td-scheduler = { path = "../td-scheduler" }
td-source = { path = "../td-source" }

tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
async-trait.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
axum-extra.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true
chrono.workspace = true
reqwest.workspace = true
sha2.workspace = true

rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[dev-dependencies]
migration = { path = "../../migration" }
td-download = { path = "../td-download" }
td-http = { path = "../td-http" }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
bytes.workspace = true
tempfile = "3"
