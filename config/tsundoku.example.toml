# tsundoku configuration (example).
#
# Copy to config/tsundoku.toml and edit, or point --config at any path.
# YAML is also supported (config/tsundoku.yaml) if you prefer it.
#
# Every value can be overridden by an environment variable using the
# TSUNDOKU_ prefix and __ for nesting, e.g.:
#   TSUNDOKU_SERVER__PORT=9000
#   TSUNDOKU_STORAGE__DATA_DIR=/var/lib/tsundoku

[server]
host = "127.0.0.1"
port = 8080

# Single on-disk root. The database, every provider's offline cache, the
# cover cache, and scratch space all live under this directory. Each
# subpath may be explicitly overridden below; otherwise they default to
# subdirectories of data_dir. Docker mounts a single volume here.
[storage]
data_dir = "./data"
# database_path        = "./data/db/tsundoku.db"
# provider_cache_dir   = "./data/cache/providers"
# cover_cache_dir      = "./data/cache/covers"
# tmp_dir              = "./data/tmp"

[logging]
level = "info"
json = false

[api]
# Mount the Scalar API docs UI at /docs
docs = true

# Single-user auth. Reads are public by default; flip `read_requires_auth`
# to gate them behind `api_key`. Write endpoints always require
# `admin_token` as a Bearer token, and are disabled (503) if unset — set
# `admin_token` before exposing the API publicly.
[auth]
read_requires_auth = false
# api_key      = "read-...........-only"
# admin_token  = "write-..........-only"

# Metadata-layer settings. Exactly one provider runs the auto-detect
# resolution path; others may still be registered for review UI search
# and foreign-ID lookups.
[metadata]
active_provider = "mangabaka"

# Scheduled + on-demand refresh of `series` rows from the active provider.
# Distinct from `providers.<id>.offline_refresh_cron`, which refreshes the
# provider's local dump but does not touch any series row. Disabled by
# default; the manual `tsundoku refresh-series` and
# `POST /api/v1/series/refresh-all` triggers still work as long as the
# active provider is registered.
# [metadata.series_refresh]
# cron         = "0 0 4 * * *"   # 04:00 UTC daily; 6-field cron (seconds first)
# batch_size   = 50               # series per tick; one outbound provider call each
# min_age_days = 7                # skip rows refreshed within this window

# Per-provider config. Adding a new provider = adding a [providers.<id>]
# block + a line in the registry builder.
[providers.mangabaka]
enabled = true
api_base_url           = "https://api.mangabaka.dev"
# Set api_key + api_fallback = true to enable live API calls. Without an
# api_key the provider runs in offline-only mode; cache misses surface as
# `Ok(None)` to the resolver.
# api_key              = "mb-..."
# api_fallback         = true
# offline_dump_url     = "https://..."        # leave unset to disable offline cache
# offline_refresh_cron = "0 4 * * 0"          # weekly Sunday 04:00 UTC; 5-field is auto-padded to seconds-0
negative_cache_ttl_days = 7
timeout_seconds        = 60

# Resolution pipeline settings. Controls how releases get matched to
# series rows. Thresholds use Dice-coefficient scoring on character
# bigrams (case- and punctuation-insensitive).
[ingestion]
# Above this Dice score, a fuzzy-title hit counts as a definitive match
# and gets persisted with resolution_path='fuzzy_title'.
resolution_threshold  = 0.85
# Minimum score to surface a candidate in the review queue. Below this
# the release stays `unresolved` with no candidates persisted.
review_threshold      = 0.55
# Cap on `MetadataProvider::search` candidates inspected per release.
fuzzy_search_limit    = 10
# When false, low-confidence hits leave the release as `unresolved`
# without populating `review_candidates`.
queue_low_confidence  = true
# Per-tick batch size for the poll loop's `releases` upserts. The loop
# walks `releases.chunks(N)`, opens one transaction per chunk, and
# commits the whole chunk in one fsync. Higher = fewer fsyncs (faster
# polls on busy feeds); a mid-batch crash loses up to N already-enriched
# rows that the next tick re-fetches (idempotent on
# `(source_kind, external_id)`). Set to 1 to revert to per-row commits.
poll_write_batch_size = 10
# Format-to-series-kind validation. A rule fires if any of its `formats`
# is detected on the release; the matched series's kind must then be one
# of `required_kinds` (case-insensitive). Otherwise the release is
# demoted to `ambiguous` for human review. Empty list disables validation.
#
# [[ingestion.format_type_rules]]
# formats        = ["cbz", "cbr", "zip", "rar"]
# required_kinds = ["manga", "manhwa", "manhua"]
#
# [[ingestion.format_type_rules]]
# formats        = ["epub", "azw3"]
# required_kinds = ["novel"]

# Title cleanup. The resolver strips structural noise (parens, brackets,
# volume/chapter markers, file extensions, format keywords, year tokens)
# from each release title before searching MangaBaka. Rules and their
# ordering live in code; the only operator surface is the keyword list
# below.
#
# `extra_format_keywords` are appended to the built-in list (Digital,
# Raw, Color, Colored, Omnibus, Premium, Complete, Decensored,
# Uncensored, Webtoon, WN, LN). Each entry is matched as a whole-word
# token, case-insensitively. Regex metacharacters are rejected at
# config load — entries must be plain words or phrases.
#
# [ingestion.cleanup]
# extra_format_keywords = ["Remastered", "DigitalUncen"]

# Outbound-HTTP rate limiting. Every request made by the source crates,
# the metadata providers, and the MangaUpdates redirect resolver routes
# through the shared limiter so a cron tick with many sources cannot
# burst against one host (the original cause of nyaa.si 429s).
#
# `default_*` apply to any host not listed in `[[ingestion.http.hosts]]`.
# Per-host overrides match case-insensitively on the URL's host
# component (no scheme, no port). The shipped defaults already cover
# nyaa.si, api.mangabaka.dev, and www.mangaupdates.com — operators only
# need to add entries here for new hosts or to tighten/relax limits.
#
# Retry behavior. On a 429 / 502 / 503 / 504 the limiter retries up to
# `default_retry_max_attempts` additional times. For 429 it honors
# `Retry-After: N` (seconds) capped at `default_retry_max_backoff_ms`;
# for 5xx (and when 429 omits the header) it uses jittered exponential
# backoff starting at `default_retry_initial_backoff_ms`. The permit
# is held across retries so a queued caller cannot race past us into
# the same rate-limited upstream. Set `_retry_max_attempts` to 0 to
# disable retries entirely.
#
# [ingestion.http]
# default_concurrency               = 2
# default_min_gap_ms                = 250
# default_retry_max_attempts        = 3
# default_retry_initial_backoff_ms  = 500
# default_retry_max_backoff_ms      = 30000
#
# [[ingestion.http.hosts]]
# host        = "nyaa.si"
# concurrency = 1
# min_gap_ms  = 1000
# # retry_* fields are optional per host; omit to inherit the
# # default_retry_* settings above.
#
# [[ingestion.http.hosts]]
# host        = "api.mangabaka.dev"
# concurrency = 2
# min_gap_ms  = 250

# Discovery sources. Each entry is one polled instance. The `kind` field
# picks the implementation; per-kind options live in the matching nested
# block (e.g. [sources.nyaa]). v1 only ships kind = "nyaa".
#
# [[sources]]
# kind    = "nyaa"
# name    = "english-manga-trusted"
# cron    = "0 */2 * * *"     # every 2 hours; 5-field crons are auto-padded to seconds-0.
                              # Omit to skip the scheduled poll; `tsundoku poll --source <name>`
                              # still works as a one-shot.
# enabled = true
#   [sources.nyaa]
#   feed_url        = "https://nyaa.si/?page=rss&c=3_1&f=2"
#   fetch_details   = true     # fetch each post's detail page to enrich files + external links
#   timeout_seconds = 30
#   site_base_url   = "https://nyaa.si"
#
# Note: Nyaa's RSS view does not paginate (`&p=N` is silently ignored).
# Steady-state polls fetch the most-recent 75 items only. To seed history
# after first install, run `tsundoku backfill <name> --pages N` once — it
# walks the paginated HTML listing pages, which the RSS feed does not.

# --- Codex integration (optional) ----------------------------------------
# Powers the admin-only "presence overlay": which discovered series you
# already own on your Codex library, and whether newer volumes/chapters have
# surfaced since. Disabled by default; the whole block may be omitted.
#
# IMPORTANT: `api_key` here is CODEX'S X-API-Key (a Codex account with the
# `series:read` scope). It is unrelated to tsundoku's own [auth] api_key /
# admin_token. `base_url` does double duty: it is the API base for the sync
# sweep AND the host used to build series deep links (<base_url>/series/{uuid}),
# so there is no separate deep-link setting.
#
# When enabled = true, base_url and api_key are REQUIRED — tsundoku refuses to
# start otherwise (a misconfigured integration would 401 on every tick).
#
# [codex]
# enabled         = true
# base_url        = "https://codex.example.com"
# api_key         = "codex-reader-api-key"
# sync_cron       = "0 */6 * * *"   # every 6 hours; omit to disable the cron (manual refresh still works).
# timeout_seconds = 30

# --- Send to torrent client (optional) ------------------------------------
# Adds an admin-only "send to torrent client" button to discovered releases.
# v1 targets ruTorrent over rTorrent XML-RPC (the same wire Prowlarr/Sonarr
# use). Disabled by default; the whole block may be omitted.
#
# Shared (client-agnostic) settings live at [download]; the connection details
# for the chosen `kind` nest under their own table — [download.rutorrent] here.
# A second client would add e.g. [download.qbittorrent].
#
# By default a release is sent as a .torrent file (the bytes are fetched from
# the release's torrent_url through the rate limiter); set prefer_torrent_file
# = false to hand ruTorrent a magnet URL instead. Both label/start/source are
# overridable per send from the UI.
#
# When enabled = true, [download.rutorrent].base_url is REQUIRED — tsundoku
# refuses to start otherwise.
#
# [download]
# enabled             = true
# kind                = "rutorrent"             # only "rutorrent" in v1.
# default_label       = "manga"                 # omit to let the client apply its own default.
# default_dir         = "/downloads/manga"      # omit to use the client default download dir.
# default_start       = true                    # false adds the torrent stopped.
# prefer_torrent_file = true                    # false sends a magnet URL instead of the .torrent file.
# timeout_seconds     = 30
# health_cron         = "0 * * * *"             # optional: recurring connection re-test. Omit to disable
#                                               # (the launch probe + manual "Test connection" still work).
#
# [download.rutorrent]
# base_url            = "https://box.example.com/rutorrent"
# username            = "rutorrent-user"        # the CLIENT'S own HTTP Basic/Digest credential (auto-negotiated),
# password            = "rutorrent-pass"        #   unrelated to tsundoku's [auth]. Omit both if unauthenticated.
# url_path            = "plugins/httprpc/action.php"  # XML-RPC endpoint: ruTorrent's httprpc plugin, or "RPC2" for a bare rTorrent mount (the default).
