# tsundoku configuration (example).
#
# Copy to config/tsundoku.toml and edit, or point --config at any path.
# YAML is also supported (config/tsundoku.yaml) if you prefer it.
#
# Every value can be overridden by an environment variable using the
# TSUNDOKU_ prefix and __ for nesting, e.g.:
#   TSUNDOKU_SERVER__PORT=9000
#   TSUNDOKU_STORAGE__DATA_DIR=/var/lib/tsundoku

[server]
host = "127.0.0.1"
port = 8080

# Single on-disk root. The database, every provider's offline cache, the
# cover cache, and scratch space all live under this directory. Each
# subpath may be explicitly overridden below; otherwise they default to
# subdirectories of data_dir. Docker mounts a single volume here.
[storage]
data_dir = "./data"
# database_path        = "./data/db/tsundoku.db"
# provider_cache_dir   = "./data/cache/providers"
# cover_cache_dir      = "./data/cache/covers"
# tmp_dir              = "./data/tmp"

[logging]
level = "info"
json = false

[api]
# Mount the Scalar API docs UI at /docs
docs = true

# Metadata-layer settings. Exactly one provider runs the auto-detect
# resolution path; others may still be registered for review UI search
# and foreign-ID lookups.
[metadata]
active_provider = "mangabaka"

# Per-provider config. Adding a new provider = adding a [providers.<id>]
# block + a line in the registry builder.
[providers.mangabaka]
enabled = true
api_base_url           = "https://api.mangabaka.dev"
# Set api_key + api_fallback = true to enable live API calls. Without an
# api_key the provider runs in offline-only mode; cache misses surface as
# `Ok(None)` to the resolver.
# api_key              = "mb-..."
# api_fallback         = true
# offline_dump_url     = "https://..."        # leave unset to disable offline cache
# offline_refresh_cron = "0 4 * * 0"          # weekly Sunday 04:00 UTC; 5-field is auto-padded to seconds-0
negative_cache_ttl_days = 7
timeout_seconds        = 60

# Resolution pipeline settings. Controls how releases get matched to
# series rows. Thresholds use Dice-coefficient scoring on character
# bigrams (case- and punctuation-insensitive).
[ingestion]
# Above this Dice score, a fuzzy-title hit counts as a definitive match
# and gets persisted with resolution_path='fuzzy_title'.
resolution_threshold  = 0.85
# Minimum score to surface a candidate in the review queue. Below this
# the release stays `unresolved` with no candidates persisted.
review_threshold      = 0.55
# Cap on `MetadataProvider::search` candidates inspected per release.
fuzzy_search_limit    = 10
# When false, low-confidence hits leave the release as `unresolved`
# without populating `review_candidates`.
queue_low_confidence  = true
# Format-to-series-kind validation. A rule fires if any of its `formats`
# is detected on the release; the matched series's kind must then be one
# of `required_kinds` (case-insensitive). Otherwise the release is
# demoted to `ambiguous` for human review. Empty list disables validation.
#
# [[ingestion.format_type_rules]]
# formats        = ["cbz", "cbr", "zip", "rar"]
# required_kinds = ["manga", "manhwa", "manhua"]
#
# [[ingestion.format_type_rules]]
# formats        = ["epub", "azw3"]
# required_kinds = ["novel"]

# Discovery sources. Each entry is one polled instance. The `kind` field
# picks the implementation; per-kind options live in the matching nested
# block (e.g. [sources.nyaa]). v1 only ships kind = "nyaa".
#
# [[sources]]
# kind    = "nyaa"
# name    = "english-manga-trusted"
# cron    = "0 */2 * * *"     # every 2 hours; 5-field crons are auto-padded to seconds-0.
                              # Omit to skip the scheduled poll; `tsundoku poll --source <name>`
                              # still works as a one-shot.
# enabled = true
#   [sources.nyaa]
#   feed_url        = "https://nyaa.si/?page=rss&c=3_1&f=2"
#   fetch_details   = false    # set true to enrich files + external links
#   timeout_seconds = 30
#   site_base_url   = "https://nyaa.si"
