<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Placeholder OG / Twitter social card. Open Graph spec wants 1.91:1
    (1200x630). Indigo gradient background, project name and tagline.
    Swap for a real designed card when convenient; nothing in the build
    depends on it being a raster.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(120 195)">
    <!-- stacked-books mark, scaled-up version of the favicon -->
    <g>
      <rect x="0" y="160" width="220" height="44" rx="6" fill="#a5b4fc"/>
      <rect x="0" y="160" width="220" height="10" fill="#e0e7ff" opacity="0.6"/>
      <rect x="18" y="100" width="200" height="44" rx="6" fill="#c7d2fe"/>
      <rect x="18" y="100" width="200" height="10" fill="#eef2ff" opacity="0.6"/>
      <rect x="-10" y="40" width="190" height="44" rx="6" fill="#e0e7ff"/>
      <rect x="-10" y="40" width="190" height="10" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>
  <g transform="translate(420 260)" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text font-size="120" font-weight="700" letter-spacing="-0.02em">tsundoku</text>
    <text y="80" font-size="36" opacity="0.75">Manga discovery sidecar for Codex</text>
  </g>
</svg>
